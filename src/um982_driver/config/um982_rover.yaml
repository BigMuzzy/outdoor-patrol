um982_driver:
  ros__parameters:
    # Stable by-id path for the CH340 USB-UART on the UM982/WTRTK-982.
    # Legacy standalone/devcontainer default. Deployment passes a fixed
    # /dev/op-gnss container port through gnss_dev; it need not expose this
    # host path inside the container. Use port:=... in the standalone launch.
    # This adapter has no unique serial: use a host ID_PATH pin if another
    # indistinguishable USB-UART adapter is attached.
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baudrate: 115200
    frame_id: gnss_link
    # rover | base_fixed | base_survey | heading2
    mode: rover
