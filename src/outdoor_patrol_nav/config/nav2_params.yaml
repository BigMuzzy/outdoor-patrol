# Nav2 parameters for the patrol robot — Phase 1 (clean-lap parity).
#
# Phase 1 deliberately has NO map and NO costmap filters. The corridor keepout
# mask and the speed mask arrive with route_to_map in Phase 2, and the MPPI
# critic weights below are tuned for tracking a clear centerline, not for
# going around things. See doc/eng/plans/nav2-migration/phase-1.md.
#
# Three settings here are walls, not knobs, and moving them to make a run pass
# defeats the point of the migration:
#   * velocity_smoother max_velocity / min_velocity mirror the ESP32-S3
#     firmware clamps in diff_drive.h (MAX_MANUAL_SPEED_MS 1.0,
#     MAX_MANUAL_ANGVEL 0.67) by way of outdoor_patrol_bringup/config/
#     chassis.yaml. Nav2 asking for more than the firmware will do produces
#     silent tracking error, not a fault.
#   * the footprint is the measured chassis, not a convenient circle.
#   * minimum_turning_radius is the 1.5 m chassis minimum from issue #8.
#
# Topic wiring, which is easy to get subtly wrong:
#
#   controller_server ─┐
#                      ├─► /cmd_vel_nav ─► velocity_smoother ─► /cmd_vel_raw
#   behavior_server  ──┘                                              │
#                                                                     ▼
#                                          scan_safety (ADR-013) ─► /cmd_vel
#
# /cmd_vel is scan_safety's OUTPUT. Nav2's servers default to publishing on
# `cmd_vel`, so every one of them is remapped in nav2.launch.py; leaving one
# unremapped puts a second writer on scan_safety's output topic and the brake
# stops being a brake.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # scan_safety and the gz DiffDrive plugin both take a plain Twist. Nav2
    # Jazzy can publish TwistStamped instead, and when it does the robot sits
    # still with no error anywhere -- the subscriber simply never matches.
    # This flag is repeated on every server that publishes velocity.
    enable_stamped_cmd_vel: false
    odom_topic: "/odometry/filtered"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathRPP"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Only the FINAL pose of a NavigateThroughPoses goal is checked; the
      # stations in between are via-points the controller passes through.
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 0.50

    # MPPI is the reason to migrate: it deviates freely inside the corridor
    # instead of following a fixed lateral offset.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 0.67
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 0.0
      az_max: 3.2
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 1.5
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      # PathAlign is the tracking weight. Phase 1 wants it HIGH: the parity
      # bar is the follower's cross-track RMS and a loose MPPI will cut every
      # corner. Phase 2 lowers it -- deliberately, and with the R4-N numbers
      # recorded next to it -- so MPPI will leave the lane for the shoulder.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 32.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

    # Registered but not selected. Phase 3 measures MPPI on the RK3588; if it
    # cannot hold 20 Hz the fallback is changing one BT attribute
    # (controller_id="FollowPathRPP"), not a rewrite. It is configured here so
    # that change is not also a config-authoring exercise on the robot.
    FollowPathRPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.67
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: true
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Measured chassis, not a circle. The body box is 0.640 x 0.440 offset
      # 0.22 m forward of the axle, and the wheels stick out to +-0.3024 m --
      # the same half-width score_run.py uses for barrier clearance. A
      # robot_radius of 0.3024 would look right and would let the nose, which
      # reaches 0.54 m forward, clip obstacles the costmap called clear.
      footprint: "[[0.56, 0.31], [0.56, -0.31], [-0.12, -0.31], [-0.12, 0.31]]"
      # No map exists. Unknown must read as free or the planner refuses to
      # leave the start pose.
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          # RPLIDAR C1: ~12 m usable. Claiming more puts phantom clears
          # beyond the sensor's reach into the costmap.
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Sized from clearance_half_width_m (0.55 in route.yaml) plus the
        # footprint half-width, so the decay reaches zero about where the
        # follower's sector check used to stop caring. Phase 2 re-tunes this
        # against the 1.8 m alley: an inflation radius wider than the corridor
        # half-width makes every cell expensive and the robot crawls.
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
        inflate_unknown: false
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling, because there is no occupancy map of the site -- GNSS is the
      # map. 60 m square at 0.10 m is 360k cells and comfortably contains the
      # 100 m sim loop (about 28 m across) from anywhere on it. A
      # NavigateThroughPoses goal covers a WHOLE lap, and
      # ComputePathThroughPoses fails outright if any pose falls outside the
      # costmap -- so this width is a function of route extent, not of sensor
      # range. Phase 2's route_to_map replaces it with a mask sized to the
      # actual route.
      rolling_window: true
      width: 60
      height: 60
      resolution: 0.1
      track_unknown_space: false
      footprint: "[[0.56, 0.31], [0.56, -0.31], [-0.12, -0.31], [-0.12, 0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
        inflate_unknown: false
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      # No map: everything off the lidar's reach is unknown, and refusing to
      # plan through it means refusing to plan at all.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP, not DIFF. The migration doc's component table says
      # `motion_model_for_search: DIFF`; SmacPlannerHybrid accepts only DUBIN
      # and REEDS_SHEPP (DIFF belongs to SmacPlanner2D and the lattice
      # planner) and would reject the whole parameter set at configure time.
      # REEDS_SHEPP is also the one that matches the intent, because it is
      # the model that plans reverse motion -- which Phase 4's retreat needs.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 1.5
      # Reverse is allowed but expensive: on a clean lap the robot should
      # never choose it, and a plan that reverses on R3-N is a finding.
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      debug_visualizations: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      # Stock Savitzky-Golay. The follower did its own smoothing in path.py;
      # this replaces it, and is why nothing from that module was ported.
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      tolerance: 1.0e-10
      do_refinement: True
      refinement_num: 2

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.67
    min_rotational_vel: 0.20
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odometry/filtered"
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # plugin_lib_names is intentionally unset: setting it replaces Jazzy's
    # default list wholesale, and patrol.xml uses SmoothPath, which is easy
    # to leave out of a hand-written list.

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # [x, y, theta]. These are the firmware clamps, not preferences.
    max_velocity: [1.0, 0.0, 0.67]
    min_velocity: [-0.35, 0.0, -0.67]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
