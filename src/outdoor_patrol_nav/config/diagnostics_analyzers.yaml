# diagnostic_aggregator analyzers for the field readout.
#
# rqt_robot_monitor subscribes to /diagnostics_agg, NOT to /diagnostics. The
# drivers publish the latter; without an aggregator in between, Robot Monitor
# connects successfully and displays "No messages received" forever, which
# reads as "the robot is not publishing" rather than "nothing is aggregating".
# That is the whole reason this file exists.
#
# Run it wherever you are watching from -- the node is a pure view concern and
# has no hardware dependency:
#
#   ros2 run diagnostic_aggregator aggregator_node --ros-args \
#     --params-file $(ros2 pkg prefix outdoor_patrol_nav)/share/outdoor_patrol_nav/config/diagnostics_analyzers.yaml
#
# The `startswith` strings are matched against the diagnostic status NAMES the
# nodes publish, which are of the form "<node>: <task>". They are:
#
#   um982_driver: GNSS                            <- fix, satellites, ANT2
#   imu_driver: IMU
#   ekf_global: odometry/filtered topic status
#   ekf_filter_node: odometry/filtered topic status
#   scan_box_filter: Heartbeat
#   lifecycle_manager_navigation: Nav2 Health
#   patrol_mission: mission                       <- only while a route is running
#
# If a group shows "Stale", the node behind it is not publishing. That is a
# real signal, not a display artefact -- one of these going stale mid-run is
# the first thing to check.
analyzers:
  ros__parameters:
    path: Robot

    # Everything an operator watches before pressing go. Grouped first
    # because it is the group that decides whether the run can happen at all.
    #
    # NOTE the discard below is FIRST on purpose: analyzers are offered each
    # status in order, and the discard has to claim the broken one before the
    # EKF analyzer does.
    localization:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Localization
      analyzers:
        # robot_localization's "<node>: odometry/filtered topic status" is
        # broken upstream: it reports "Events since startup: 0" and "Actual
        # frequency 0.000000" against a 25.2-35.2 Hz band while the topic is
        # measurably publishing at 30.0 Hz. It has never once ticked, so it
        # carries no information -- it is a permanent, unconditional ERROR.
        #
        # Discarded rather than displayed. A health screen that is always red
        # is worse than no health screen: it trains the operator to ignore
        # red, and the whole point of this window is that red means stop.
        #
        # There is deliberately NO EKF GenericAnalyzer beside this one. That
        # broken status is the ONLY diagnostic either EKF publishes, so an
        # EKF group would contain nothing else -- and AnalyzerGroup hands a
        # status to EVERY analyzer that matches it, so a group that also
        # matched would re-raise exactly what this discards. EKF health is
        # instead read off /odometry/global, which RViz draws.
        #
        # Verify before removing this: `ros2 topic hz /odometry/filtered`
        # against the "Actual frequency" the diagnostic claims. If they ever
        # agree, the upstream bug is fixed and this block should go.
        ekf_broken_freq:
          type: diagnostic_aggregator/DiscardAnalyzer
          path: DiscardedEkfFrequency
          contains: [ 'odometry/filtered topic status' ]
        gnss:
          type: diagnostic_aggregator/GenericAnalyzer
          path: GNSS
          startswith: [ 'um982_driver' ]
        imu:
          type: diagnostic_aggregator/GenericAnalyzer
          path: IMU
          startswith: [ 'imu_driver' ]

    # The mission layer. Absent until patrol_mission starts, which is correct:
    # there is no mission to report on before then.
    mission:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Mission
      startswith: [ 'patrol_mission' ]

    navigation:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Navigation
      startswith: [ 'lifecycle_manager_navigation' ]

    sensors:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Sensors
      startswith: [ 'scan_box_filter', 'sllidar' ]

# NOTE: no catch-all analyzer. diagnostic_aggregator already files unmatched
# statuses under "Other" by itself, and adding an explicit one that matches
# everything does not extend the coverage -- it DUPLICATES every status, so
# each fault appears twice in Robot Monitor under two different paths. Left
# out deliberately; the automatic Other is the catch-all.
