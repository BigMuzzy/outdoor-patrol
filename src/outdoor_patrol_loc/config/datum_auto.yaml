# Datum policy overlay for navsat_transform — layered AFTER config/navsat.yaml
# by global_localization.launch.py, so it only has to state the keys that
# differ.
#
# This is the DEFAULT overlay: auto-datum on the first valid fix, i.e. the map
# origin lands wherever the robot happens to get its first fix. Fine for a
# single live session, useless for comparing two of them — a route recorded in
# session A does not overlay session B.
#
# Pass `datum_params_file:=<other.yaml>` to swap in a fixed per-site datum. See
# outdoor_patrol_sim/config/navsat_datum_sim.yaml for the worked example.
navsat_transform:
  ros__parameters:
    wait_for_datum: false
