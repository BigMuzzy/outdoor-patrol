# Chassis geometry, module mounts, and speed limits — single source of
# truth for M0+. Read directly by the URDF
# (urdf/outdoor_patrol.urdf.xacro via xacro.load_yaml) so geometry lives in
# exactly one place.
#
# Wheel radius / separation mirror the ESP32-S3 firmware constants in
# src/esp32-s3-uros-controller/firmware/main/diff_drive.h
# (WHEEL_DIAMETER_M = 0.17068 -> radius 0.08534, TRACK_WIDTH_M = 0.54481,
#  MAX_MANUAL_SPEED_MS = 1.0, MAX_MANUAL_ANGVEL = 0.67).
# Keep this file and diff_drive.h in lock-step.
chassis:
  # Wheel radius in meters (= WHEEL_DIAMETER_M / 2 in firmware).
  wheel_radius: 0.08534
  # Distance between left and right wheel centers, meters
  # (= TRACK_WIDTH_M in firmware).
  wheel_separation: 0.54481
  # Height of base_link origin above the ground, meters. Used for the URDF
  # base_footprint -> base_link offset (and the GNSS lever-arm Z reference).
  base_height: 0.150
  # Chassis visual box — cosmetic (RViz only).
  body_length: 0.640
  body_width: 0.440
  body_height: 0.200
  # Fore-aft offset of the visual box center from base_link (the wheel axle).
  # The body sits 0.22 m forward of the axle. +X = forward (nose). Cosmetic.
  body_offset_x: 0.22
  wheel_width: 0.060
  # --- Simulation-only (consumed by the URDF when sim:=true) ---------------
  # Estimated masses for the Gazebo inertia tensors (outdoor_patrol_sim).
  # They do NOT affect the real robot; refine against a real weigh-in if the
  # sim's acceleration / tipping behaviour stops matching the field.
  body_mass: 28.0    # kg, chassis + payload
  wheel_mass: 1.6    # kg, per drive wheel
  # Teleop speed clamps — mirror firmware MAX_MANUAL_* limits so that
  # PC-side teleop never asks for more than the controller will allow.
  max_linear_velocity: 1.0    # m/s   (MAX_MANUAL_SPEED_MS)
  max_angular_velocity: 0.67  # rad/s (MAX_MANUAL_ANGVEL)

# Sensor / module mount frames. Each entry becomes a URDF link + fixed
# joint at the given pose in its parent frame (REP-103: X fwd, Y left,
# Z up). xyz/rpy are space-separated strings so they drop straight into
# <origin>. Re-survey a module -> edit its pose here; no URDF edit needed.
modules:
  # GNSS primary-antenna (ANT1) phase center relative to base_link, which
  # sits base_height above the drive-axle midpoint on the centerline.
  # Measured 2026-06-30: ANT1 0.28 m forward, 0.42 m RIGHT of centerline,
  # 0.33 m above ground (z = 0.33 - base_height 0.15 = 0.18). Antennas are
  # mounted laterally (ANT2 0.42 m LEFT), 0.84 m baseline -> the 90 deg yaw
  # offset lives in outdoor_patrol_loc config/heading_to_imu.yaml.
  gnss_link: { parent: base_link, xyz: "0.28 -0.42 0.18", rpy: "0 0 0" }
  # UMKA IMU-E73 (M2) — replaced the failed Inertial Labs KERNEL 2026-07-10.
  # Mounted with sensor axes X->front, Y->left, Z->up == REP-103, i.e. ALIGNED
  # with base_link, so the rotation is identity (rpy "0 0 0"). (The old KERNEL
  # sat X->up / Y->right / Z->fwd and needed rpy "0 -1.5708 3.14159".) xyz is
  # the prior KERNEL mount (0.281 m forward, centerline, 0.17 m above base_link)
  # carried over — re-measure if the new unit sits elsewhere; it does not affect
  # the vyaw-only fusion (angular velocity is lever-arm independent). Validate
  # on robot: drive CCW -> /imu_driver/data angular_velocity.z should be +.
  imu_link:  { parent: base_link, xyz: "0.281 0 0.17", rpy: "0 0 0" }
  # Slamtec RPLIDAR C1 (M3 2D obstacle avoidance, ADR-013). Mount measured
  # 2026-07-11: 0.512 m forward, on centerline, 0.05 m above base_link
  # (~0.20 m above ground; low mount -> watch ground strikes / chassis
  # occlusion). Two corrections for this unit: (1) L/R handedness is set by the
  # sllidar `inverted` flag -- inverted:=FALSE is correct here (confirmed in
  # RViz on the robot; a mirror can't go in rpy); (2) the sensor is mounted
  # YAW-180 -- its 0 deg points BACKWARD at the robot body -- so lidar_link is
  # yawed pi to place the scan in base_link correctly. scan_safety uses
  # forward_offset_deg=180 to match (raw-angle node, no TF). Verified
  # 2026-07-11: sensor-180 sector (robot-forward) is open (1.6 m) while sensor-0
  # (body) reads ~0.2 m.
  lidar_link: { parent: base_link, xyz: "0.512 0 0.05", rpy: "0 0 3.14159" }
