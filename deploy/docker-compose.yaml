services:
  robot:
    image: outdoor-patrol:arm64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      platforms:
        - linux/arm64
    container_name: outdoor-patrol
    restart: unless-stopped
    # ROS 2 DDS discovery needs host networking (and host IPC for shared memory).
    network_mode: host
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      # ROS_DOMAIN_ID: "42"
      # Use Cyclone DDS — more robust than Fast DDS when the dev box has
      # multiple NICs on the same subnet (wired + WiFi) and clients live
      # on a WiFi AP that filters some multicast.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      # USB-CDC device exposed by the ESP32-S3 micro-ROS firmware. Override
      # at the host with `SERIAL_DEV=/dev/ttyACM1 docker compose up -d` if
      # the Pi enumerates a different node.
      SERIAL_DEV: "${SERIAL_DEV:-/dev/ttyACM0}"
      SERIAL_BAUD: "${SERIAL_BAUD:-115200}"
    # Map host hardware. Uncomment additional entries as sensors arrive.
    devices:
      - "${SERIAL_DEV:-/dev/ttyACM0}:${SERIAL_DEV:-/dev/ttyACM0}"   # ESP32-S3 micro-ROS
      # UM982 RTK GNSS (CH340). Mapped by its stable by-id path so the
      # `port:` in um982_driver/config/um982_rover.yaml resolves inside the
      # container — Docker maps the device node, not the /dev/serial/by-id
      # symlink. Override with GNSS_DEV if the receiver re-enumerates.
      - "${GNSS_DEV:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}:${GNSS_DEV:-/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0}"   # UM982 GNSS
      # Inertial Labs KERNEL IMU (FTDI FT230X). Mapped by its stable by-id
      # path so the `port:` in imu_driver/config/imu_driver.yaml resolves
      # inside the container. Override with IMU_DEV if the unit re-enumerates.
      - "${IMU_DEV:-/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DO01MCPU-if00-port0}:${IMU_DEV:-/dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DO01MCPU-if00-port0}"   # Inertial Labs KERNEL IMU
      # RPLIDAR C1 (M3, 2D obstacle avoidance). USB-UART adapter = Silicon Labs
      # CP2102N; mapped by its stable by-id path so `lidar_dev` resolves inside
      # the container. Override with LIDAR_DEV if it re-enumerates.
      - "${LIDAR_DEV:-/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_f86253bee863ef11a2a1e2a9c169b110-if00-port0}:${LIDAR_DEV:-/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_f86253bee863ef11a2a1e2a9c169b110-if00-port0}"   # RPLIDAR C1
    #   - /dev/i2c-1:/dev/i2c-1
    #   - /dev/video0:/dev/video0
    #   - /dev/dri:/dev/dri           # Mali GPU
    #   - /dev/rknpu:/dev/rknpu       # RK3588 NPU
    group_add:
      - dialout
    #   - video
    #   - plugdev
    # Keep stdin open + allocate a TTY so `docker exec` runs the keyboard
    # teleop in a second shell without losing input.
    stdin_open: true
    tty: true
    volumes:
      # Persist logs / maps / params on the host.
      - ./data:/data
      # If you want hot-reload of launch/config files without rebuilding the
      # image, bind-mount a config dir here instead.
      # - ./config:/opt/outdoor-patrol/config:ro
    # GNSS global-localization bringup (ADR-012): micro-ROS agent +
    # robot_state_publisher + UM982 RTK GNSS/NTRIP + dual-EKF + heading
    # adapter. RViz runs on the dev box instead (use_rviz:=false here).
    # RTK corrections: drop a real caster ntrip.yaml in ./data (-> /data)
    # and start with `NTRIP_PARAMS=/data/ntrip.yaml docker compose up -d`.
    # Unset -> the in-image example (standalone fix, no live caster).
    # Keyboard teleop still works in a second shell:
    #   docker exec -it outdoor-patrol \
    #     ros2 run teleop_twist_keyboard teleop_twist_keyboard
    command:
      - "ros2"
      - "launch"
      - "outdoor_patrol_bringup"
      - "gnss_localization.launch.py"
      - "serial_dev:=${SERIAL_DEV:-/dev/ttyACM0}"
      - "serial_baud:=${SERIAL_BAUD:-115200}"
      - "use_rviz:=false"
      - "ntrip_params_file:=${NTRIP_PARAMS:-/opt/outdoor-patrol/install/share/ntrip_client/config/ntrip.yaml.example}"
      - "lidar_dev:=${LIDAR_DEV:-/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_f86253bee863ef11a2a1e2a9c169b110-if00-port0}"

  # Field validation dashboard, run ON THE ROBOT.
  #
  # Only the GATE LOGIC lives here; RViz and the panel run on the dev box and
  # talk to this over /field_dashboard/{state,command}. Running it on the
  # robot rather than the dev box is what makes teach-and-repeat work with
  # nothing to copy: Phase 3 launches route_recorder here, so the route is
  # written straight to /data/routes on the robot's own disk, which is
  # exactly where route_follower reads it from.
  #
  # Not started by default -- bring it up only for a validation session:
  #   docker compose -f deploy/docker-compose.yaml --profile validation up -d
  #
  # Reports land in /data/reports. Both survive container restarts via the
  # ./data bind mount.
  dashboard:
    image: outdoor-patrol:arm64
    container_name: outdoor-patrol-dashboard
    profiles: ["validation"]
    depends_on:
      - robot
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
    volumes:
      - ./data:/data
    # SITE picks the profile: alley (default) or driveway. They differ in
    # route shape, corridor width and the retreat, not in anything safety
    # related -- see the config headers.
    command:
      - "bash"
      - "-lc"
      - >-
        ros2 run outdoor_patrol_validation field_dashboard --ros-args
        --params-file /opt/outdoor-patrol/install/share/outdoor_patrol_validation/config/field_dashboard${SITE_SUFFIX:-}.yaml
        -p site:=${SITE:-alley}
